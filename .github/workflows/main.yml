
name: Publicar EduPeque en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del frontend
        run: |
          mkdir public
          cp -r frontend/. public/
          find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec sed -i 's|/assets/|/EduPeque/assets/|g; s|/pages/|/EduPeque/pages/|g' {} +
          touch public/.nojekyll

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
