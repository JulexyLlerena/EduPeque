name: Publicar EduPeque en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del frontend
        run: |
          set -e

          mkdir -p public
          cp -r frontend/. public/

          # Adaptar rutas absolutas de recursos HTML al subdirectorio base de GitHub Pages (/EduPeque/)
          python3 - <<'PY'
          from pathlib import Path
          import re

          base_path = "/EduPeque/"
          # Ajusta atributos HTML (href, src, action) que apunten a /assets/, /pages/ o /index.html
          html_attr_pattern = re.compile(
              r'(href|src|action)=(["\'])/(assets|pages|index\.html)([/?#"\'\s]|$)'
          )

          for file in Path("public").rglob("*.html"):
              content = file.read_text(encoding="utf-8")
              updated = html_attr_pattern.sub(
                  lambda m: f'{m.group(1)}={m.group(2)}{base_path}{m.group(3)}{m.group(4)}',
                  content
              )
              if updated != content:
                  file.write_text(updated, encoding="utf-8")
                  print(f"Rutas HTML adaptadas: {file}")

          PY

          touch public/.nojekyll

      - name: Verificar archivos publicados
        run: |
          set -e

          test -f public/index.html
          test -f public/pages/docente/mi-aula.html
          test -f public/pages/familia/resumen.html
          test -f public/pages/dece/seguimiento.html
          test -f public/assets/js/config.js

          echo "Frontend preparado correctamente para GitHub Pages."
          echo "Comprobación de rutas en index.html:"
          grep -E "(href|src)=" public/index.html | head -n 10

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
