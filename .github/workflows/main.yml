
name: Publicar EduPeque en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del frontend
        run: |
          set -e

          mkdir -p public
          cp -r frontend/. public/

          python3 - <<'PY'
          from pathlib import Path
          import re

          base_path = "/EduPeque/"
          extensions = {".html", ".css", ".js", ".mjs", ".json", ".webmanifest"}

          pattern = re.compile(
              r'(?<![A-Za-z0-9:/._-])/(assets|pages|index\.html)(?=/|[?#"\'`)\\s]|$)'
          )

          for file in Path("public").rglob("*"):
              if file.is_file() and file.suffix.lower() in extensions:
                  content = file.read_text(encoding="utf-8")
                  updated = pattern.sub(
                      lambda match: base_path + match.group(1),
                      content
                  )

                  if updated != content:
                      file.write_text(updated, encoding="utf-8")
                      print(f"Rutas corregidas: {file}")

          PY

          touch public/.nojekyll

      - name: Verificar archivos publicados
        run: |
          set -e

          test -f public/index.html
          test -f public/pages/familia/resumen.html
          test -f public/pages/dece/seguimiento.html

          echo "Frontend preparado correctamente."
          echo "Archivos principales encontrados:"
          ls -la public/
          ls -la public/pages/familia/
          ls -la public/pages/dece/

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
